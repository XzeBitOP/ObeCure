    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #fff7ed 0%, #fff1f2 50%, #fefce8 100%);
        background-attachment: fixed;
      }
      .dark body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #000000 100%);
        background-attachment: fixed;
      }
      
      .font-handwriting {
        font-family: 'Kalam', cursive;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
      @keyframes dropdown { from { opacity: 0; transform: translateY(-10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .animate-dropdown { animation: dropdown 0.2s ease-out forwards; }
      @keyframes bounceIn {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.05); opacity: 1; }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); }
      }
      .animate-bounce-in { animation: bounceIn 0.5s ease-out forwards; }
      @keyframes float { from { transform: translateY(0) rotate(0deg); opacity: 0.5; } to { transform: translateY(-450px) rotate(360deg); opacity: 0; } }
      .animate-float { animation: float ease-in infinite; }
      @keyframes animated-gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      .animate-gradient-pulse { background-size: 200% 200%; animation: animated-gradient 8s ease-in-out infinite; }
       @keyframes drawCheck { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      .animate-draw-check { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawCheck 0.5s ease-out 0.3s forwards; }
      @keyframes sparkle { 0%, 100% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 80% { transform: scale(0.8); opacity: 0.5;} }
      .sparkle { animation: sparkle 0.8s ease-in-out; transform-origin: center; }
      @keyframes glowing-body { 0%, 100% { filter: drop-shadow(0 0 5px #fbbf24) drop-shadow(0 0 10px #f97316) opacity(0.8); } 50% { filter: drop-shadow(0 0 15px #fbbf24) drop-shadow(0 0 25px #f97316) opacity(1); } }
      .animate-glowing-body { animation: glowing-body 4s ease-in-out infinite; }
      @keyframes glowing-orange-border { 0%, 100% { box-shadow: 0 0 5px #fbbf24, 0 0 10px #f97316, inset 0 0 5px #fbbf24; border-color: #fbbf24; } 50% { box-shadow: 0 0 15px #fbbf24, 0 0 25px #f97316, inset 0 0 10px #f97316; border-color: #f59e0b; } }
      .animate-glowing-orange-border { animation: glowing-orange-border 3s ease-in-out infinite; }
      @keyframes flame-flicker { 0%, 100% { transform: scale(1) rotate(-1deg); opacity: 1; } 50% { transform: scale(1.05) rotate(1deg); opacity: 0.95; } }
      @keyframes subtle-glow { 0%, 100% { filter: drop-shadow(0 0 4px #f59e0b) drop-shadow(0 0 8px #ef4444); } 50% { filter: drop-shadow(0 0 8px #f59e0b) drop-shadow(0 0 16px #ef4444); } }
      .animate-flame { animation: flame-flicker 1.5s ease-in-out infinite, subtle-glow 2.5s ease-in-out infinite; }
      @keyframes shimmer { 100% { transform: translateX(100%); } }
      .animate-shimmer { animation: shimmer 2s infinite; }
      
      /* Exercise Animations */
      @keyframes ex-squat-legs { 0%, 100% { d: path("M 70 150 L 70 200 L 70 250"); } 50% { d: path("M 70 150 L 40 180 L 70 250"); } }
      @keyframes ex-squat-body { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(30px); } }
      @keyframes ex-jack-arms { 0%, 100% { d: path("M 100 70 L 100 130"); } 50% { d: path("M 100 70 L 150 40"); } }
      @keyframes ex-jack-legs { 0%, 100% { d: path("M 100 150 L 100 250"); } 50% { d: path("M 100 150 L 140 250"); } }
      @keyframes ex-pushup-body { 0%, 100% { transform: rotate(-10deg); transform-origin: 150px 250px; } 50% { transform: rotate(30deg); transform-origin: 150px 250px; } }
      @keyframes ex-leg-raise { 0%, 100% { d: path("M 100 150 L 100 250"); } 50% { d: path("M 100 150 L 150 150"); } }
      @keyframes ex-stretch-body { 0%, 100% { transform: rotate(0deg); transform-origin: 100px 200px; } 50% { transform: rotate(15deg); transform-origin: 100px 200px; } }
      @keyframes ex-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
